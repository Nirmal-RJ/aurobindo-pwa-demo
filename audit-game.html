<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102a40">
  <title>Audit game · Aurobindo Pharma</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="audit-game.css?v=19">
  <script src="audit-game.js?v=27" defer></script>
</head>
<body>
  <main id="game">
    <div id="viewport"><div id="scene" aria-label="Laboratory scene"></div></div>
    <header class="hud">
      <a class="exit-button" href="index.html#/games" aria-label="Back to games"><img src="assets/test-tube-game-assets/images/exit-button.webp" alt=""></a>
      <div class="heading"><strong>Audit game</strong><span id="progress">Scenario 1 / 10</span></div>
      <div id="clock" role="timer" aria-label="Time remaining"><img class="clock-icon" src="assets/stopwatch.svg" alt=""><span id="seconds">90</span><small>s</small><div class="time-track"><div id="time-bar"></div></div></div>
    </header>
    <footer class="toolbar">
      <div class="zoom-controls" aria-label="Scene zoom">
        <button id="zoom-out" class="icon-button" aria-label="Zoom out">−</button>
        <button id="zoom-reset" aria-label="Reset zoom">1×</button>
        <button id="zoom-in" class="icon-button" aria-label="Zoom in">+</button>
      </div>
      <span id="selected-count" aria-live="polite">0 selected</span>
      <button id="submit" class="primary" disabled>Submit →</button>
      <button id="scene-next" class="primary" hidden>Next →</button>
    </footer>
    <div id="scene-sticker" class="scene-sticker" hidden></div>
    <section id="intro" aria-label="Find the contaminated test tube">
      <img class="intro-background" src="assets/audit-game-assets/home-page-assets/bg.webp" alt="" fetchpriority="high">
      <button id="start" type="button" aria-label="Play" disabled><img src="assets/audit-game-assets/home-page-assets/play-button.webp" alt="" draggable="false"></button>
    </section>
    <section id="report" class="scrim" hidden aria-labelledby="report-title">
      <div class="report-panel">
        <div class="report-top"><span id="report-label" class="eyebrow">AUDIT COMPLETE</span><span id="report-summary"></span></div>
        <div class="report-body">
          <div class="report-hero"><div id="report-mascot"></div><h1 id="report-title">Your report</h1><p id="report-caption"></p><div id="report-stats"></div></div>
          <div id="report-results" hidden></div>
        </div>
        <div class="report-actions"><a href="index.html#/games">← Back to games</a><button id="replay" class="primary">Try again ↻</button><button id="report-next" class="primary" hidden>Next scenario →</button></div>
      </div>
    </section>
    <section id="rotate" class="scrim" hidden><div class="panel"><div class="rotate-icon" aria-hidden="true">↻</div><h2>Rotate your device</h2><p>Play in landscape</p></div></section>
  </main>
</body>
</html>
