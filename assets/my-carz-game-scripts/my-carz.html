<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b26"><title>My Carz | Aurobindo Pharma</title><link rel="icon" href="../my-carz-game-assets/icon.svg"><link rel="stylesheet" href="my-carz.css?v=4"><link rel="stylesheet" href="my-carz-flow.css?v=68">
<script src="my-carz-config.js?v=29" defer></script><script src="my-carz-core.js?v=2" defer></script><script src="my-carz-store.js?v=1" defer></script><script src="my-carz-assets.js?v=a1d79e25e0643f10" defer></script><script src="my-carz-asset-cache.js?v=1" defer></script><script src="my-carz-preload.js?v=2" defer></script><script src="my-carz-paint.js?v=4" defer></script><script src="my-carz-race-view.js?v=13" defer></script><script src="my-carz-attention.js?v=12" defer></script><script src="my-carz-reward-view.js?v=13" defer></script><script src="my-carz-audio.js?v=2" defer></script><script src="my-carz.js?v=60" defer></script></head><body>
<main id="game" class="carz-app">
<section id="opening" class="view opening" aria-label="My Carz loading screen"><h1 class="sr-only">My Carz</h1><div id="loader" class="carz-loader"><label for="load-progress">Preparing your drive <span id="load-percent">0%</span></label><progress id="load-progress" max="100" value="0"></progress><p id="load-status" role="status">Loading game assets…</p><button id="load-retry" hidden>Retry</button></div><button id="opening-next" class="art-button opening-next" aria-label="Next" hidden disabled><img src="../my-carz-game-assets/page-1/next-button.webp" alt="" width="2170" height="725"></button></section>
<section id="demo" class="view demo-view" aria-label="Game introduction" hidden><img id="demo-image" alt=""><nav class="slide-nav" aria-label="Demo navigation"><button id="demo-prev">Previous</button><span id="demo-counter"></span><button id="demo-next">Next →</button></nav></section>
<section id="home" class="view garage-view" aria-label="My Carz home" hidden><h1>MY CARZ</h1><span id="home-level" class="level-label"></span><img id="home-car" class="showcase-car" alt="Selected car"><div class="home-name-bar"><button id="home-previous" aria-label="Select previous unlocked car"><span aria-hidden="true">❮</span></button><h2 id="home-name" class="car-name"></h2><button id="home-next" aria-label="Select next unlocked car"><span aria-hidden="true">❯</span></button></div><div id="home-cars" class="carz-carousel" role="group" aria-label="Choose your car"></div><fieldset class="carz-paints"><legend>Car paint</legend><div id="home-paints"></div></fieldset><p class="home-reset-copy">Game will reset at 12 am everyday</p><button id="start-driving" class="art-button" aria-label="Start driving"><img src="../my-carz-game-assets/page-3/start-driving-button.webp" alt=""></button><div id="returning-actions" class="returning-actions" hidden><button id="open-help" class="art-button" aria-label="How to play"><img src="../my-carz-game-assets/page-3/how-to-play-button.webp" alt=""></button><button id="open-cars" class="art-button" aria-label="My cars"><img src="../my-carz-game-assets/page-3/my-cars-button.webp" alt=""></button></div></section>
<section id="collection" class="view garage-view" aria-label="My cars collection" hidden><h1>MY CARS</h1><p id="unlocked-today"></p><img id="collection-car" class="showcase-car" alt="Selected car"><div class="collection-name-bar"><button id="collection-previous" aria-label="Previous car">&#10094;</button><h2 id="collection-name" class="car-name"></h2><button id="collection-next" aria-label="Next car">&#10095;</button></div><div id="collection-cars" class="carz-carousel" role="group" aria-label="Your car collection"></div><fieldset class="carz-paints"><legend>Car paint</legend><div id="collection-paints"></div></fieldset><button id="collection-drive" class="art-button" aria-label="Start driving" hidden><img src="../my-carz-game-assets/page-3/start-driving-button.webp" alt=""></button><button id="collection-back" class="art-button" aria-label="Back"><img src="../my-carz-game-assets/page-4/back-button.webp" alt=""></button></section>
<section id="race" class="view race-view" aria-label="Driving game" hidden><div class="intro-dimmer" aria-hidden="true"></div><div class="race-world"><div class="carz-scenery left"></div><div id="track" class="carz-track"><canvas id="road" aria-hidden="true"></canvas><div id="tunnels" class="tunnels" hidden><img id="tunnel-0" alt=""><img id="tunnel-1" alt=""></div><div id="lane-arrow" class="lane-arrow" aria-hidden="true" data-active="false"><i></i><i></i><i></i><i></i></div><img id="race-car" class="race-car" alt="Your car"><div id="car-effects" aria-hidden="true"></div></div><div class="carz-scenery right"></div></div><header class="carz-hud"><button id="exit-race" class="art-button" aria-label="Exit game"><img src="../my-carz-game-assets/page-5/exit-button.webp" alt=""></button><span id="race-level"></span><div id="diamonds" role="status" aria-label="Diamonds"></div></header><div class="carz-question"><img class="question-frame" src="../my-carz-game-assets/page-5/question-panel-white.webp" alt="" aria-hidden="true"><h2 id="question">Get ready</h2><div class="time-bar"><i id="question-time"></i></div></div><div id="countdown" class="carz-countdown" role="status" aria-live="polite" aria-atomic="true" hidden><strong id="countdown-value" class="countdown-value">3</strong></div><div id="feedback" class="carz-feedback" role="status" hidden></div></section>
<section id="modal" class="carz-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden><div class="carz-modal-card"><img id="modal-art" class="modal-art" alt="" hidden><h2 id="modal-title"></h2><p id="modal-copy"></p><div id="streak-broken" hidden><img src="../my-carz-game-assets/page-7/streak-broken.webp" alt="Streak broken"></div><div id="scratch-area" class="scratch-area" hidden><img id="scratch-car" alt="New car"><canvas id="scratch" tabindex="0" aria-label="Scratch to reveal the new car. Drag across the card, or press Space repeatedly to scratch rows."></canvas></div><img id="reward-car" class="reward-car" alt="Unlocked car" hidden><div id="next-car-info" hidden></div><div id="all-cars-summary" hidden><div class="all-cars-rays" aria-hidden="true"></div><img id="all-cars-hero" alt="Your selected car"><div class="all-cars-collection"><strong class="all-cars-count">9/9</strong><div id="all-cars-grid"></div></div></div><div id="modal-actions"></div></div></section>
<aside id="reset-notice" class="reset-notice" role="status" hidden></aside><aside id="portrait" class="portrait-guide" hidden><h2>Turn your phone</h2><p>My Carz plays in portrait.</p></aside><p id="save-error" class="save-error" role="alert" hidden></p>
</main></body></html>
