<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b26"><title>My Carz | Aurobindo Pharma</title><link rel="icon" href="../my-carz-game-assets/icon.svg"><link rel="stylesheet" href="my-carz.css?v=4"><link rel="stylesheet" href="my-carz-flow.css?v=1">
<script src="my-carz-config.js?v=1" defer></script><script src="my-carz-core.js?v=1" defer></script><script src="my-carz-store.js?v=1" defer></script><script src="my-carz-assets.js?v=a80310be6629b2ac" defer></script><script src="my-carz-asset-cache.js?v=1" defer></script><script src="my-carz-preload.js?v=1" defer></script><script src="my-carz-paint.js?v=1" defer></script><script src="my-carz.js?v=3" defer></script></head><body>
<main id="game" class="carz-app">
<section id="opening" class="view opening" aria-label="My Carz loading screen"><h1 class="sr-only">My Carz</h1><div id="loader" class="carz-loader"><label for="load-progress">Preparing your drive <span id="load-percent">0%</span></label><progress id="load-progress" max="100" value="0"></progress><p id="load-status" role="status">Loading game assets…</p><button id="load-retry" hidden>Retry</button></div><button id="opening-next" class="art-button opening-next" aria-label="Next" disabled><img src="../my-carz-game-assets/page-1/next-button.webp" alt="" width="2170" height="725"></button><a class="opening-back" href="../../index.html#/games">Back to games</a></section>
<section id="demo" class="view demo-view" aria-label="Game introduction" hidden><img id="demo-image" alt=""><div class="demo-copy"><h2 id="demo-title"></h2><p id="demo-text"></p></div><nav class="slide-nav" aria-label="Demo navigation"><button id="demo-prev">Previous</button><span id="demo-counter"></span><button id="demo-next">Next →</button></nav></section>
<section id="home" class="view garage-view" aria-label="My Carz home" hidden><h1>MY CARZ</h1><span id="home-level" class="level-label"></span><img id="home-car" class="showcase-car" alt="Selected car"><h2 id="home-name" class="car-name"></h2><div id="home-cars" class="carz-carousel" role="group" aria-label="Choose your car"></div><fieldset class="carz-paints"><legend>Car paint</legend><div id="home-paints"></div></fieldset><button id="start-driving" class="art-button" aria-label="Start driving"><img src="../my-carz-game-assets/page-3/start-driving-button.webp" alt=""></button><div id="returning-actions" class="returning-actions" hidden><button id="open-help" class="art-button" aria-label="How to play"><img src="../my-carz-game-assets/page-3/how-to-play-button.webp" alt=""></button><button id="open-cars" class="art-button" aria-label="My cars"><img src="../my-carz-game-assets/page-3/my-cars-button.webp" alt=""></button></div><a href="../../index.html#/games">Back to games</a></section>
<section id="collection" class="view garage-view" aria-label="My cars collection" hidden><h1>MY CARS</h1><p id="unlocked-today"></p><img id="collection-car" class="showcase-car" alt="Selected car"><h2 id="collection-name" class="car-name"></h2><div id="collection-cars" class="carz-carousel" role="group" aria-label="Your car collection"></div><fieldset class="carz-paints"><legend>Car paint</legend><div id="collection-paints"></div></fieldset><button id="collection-back" class="art-button" aria-label="Back"><img src="../my-carz-game-assets/page-4/back-button.webp" alt=""></button></section>
<section id="race" class="view race-view" aria-label="Driving game" hidden><div class="race-world"><div class="carz-scenery left"></div><div id="track" class="carz-track"><canvas id="road" aria-hidden="true"></canvas><div id="tunnels" class="tunnels" hidden><img id="tunnel-0" alt=""><img id="tunnel-1" alt=""></div><div id="lane-arrow" class="lane-arrow" aria-hidden="true"><i></i><i></i><i></i></div><img id="race-car" class="race-car" alt="Your car"><div id="car-effects" aria-hidden="true"></div></div><div class="carz-scenery right"></div></div><header class="carz-hud"><button id="exit-race" aria-label="Exit game">×</button><span id="race-level"></span><div id="diamonds" role="status" aria-label="Diamonds"></div><button id="pause-race" aria-label="Pause game">Ⅱ</button></header><div class="carz-question"><h2 id="question">Get ready</h2><div class="time-bar"><i id="question-time"></i></div></div><div id="countdown" class="carz-countdown" role="status" hidden></div><div id="feedback" class="carz-feedback" role="status" hidden></div><div id="steering" class="carz-steering"><button data-lane="0" aria-label="Steer left">←</button><span>SWIPE TO STEER</span><button data-lane="1" aria-label="Steer right">→</button></div></section>
<section id="modal" class="carz-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden><div class="carz-modal-card"><img id="modal-art" class="modal-art" alt="" hidden><h2 id="modal-title"></h2><p id="modal-copy"></p><div id="scratch-area" class="scratch-area" hidden><img id="scratch-car" alt="New car"><canvas id="scratch" aria-label="Scratch to reveal the new car"></canvas><button id="reveal-car">Reveal car</button></div><img id="reward-car" class="reward-car" alt="Unlocked car" hidden><div id="next-car-info" hidden></div><div id="modal-actions"></div></div></section>
<aside id="reset-notice" class="reset-notice" role="status" hidden></aside><aside id="portrait" class="portrait-guide" hidden><h2>Turn your phone</h2><p>My Carz plays in portrait.</p></aside><p id="save-error" class="save-error" role="alert" hidden></p>
</main></body></html>
