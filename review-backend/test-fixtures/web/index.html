<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QSL Game Review · Sign in</title><link rel="stylesheet" href="./login.css"><script type="module" src="./login.js"></script></head><body><main class="login-shell"><a class="wordmark" href="./">✦ <span>QSL<span class="sub-brand">GAME REVIEW</span></span></a><section class="login-card"><div class="eyebrow">TEAM REVIEW SPACE</div><h1 id="heading">Welcome back.</h1><p id="description">Enter your employee ID to continue.</p><form id="login" data-activity-action="review-login" hidden><label for="employee">Employee ID</label><input id="employee" name="employee" inputmode="numeric" autocomplete="username" pattern="[0-9]{1,12}" maxlength="12" placeholder="Your employee ID" required><button id="submit" type="submit">Continue <span aria-hidden="true">→</span></button><p class="hint">We’ll keep you signed in on this device.</p></form><section id="signed-in" hidden><div class="identity"><span id="initial"></span><div><strong id="name"></strong><small id="member"></small></div></div><p class="hint">You’re signed in. Shared discussions are being connected next.</p><button id="logout" data-activity-action="review-logout" type="button" class="secondary">Sign out</button></section><p id="status" role="status">Checking your saved login…</p><p id="error" role="alert" hidden></p><button id="retry" data-activity-action="review-login-retry" class="secondary" type="button" hidden>Try again</button></section><footer>Quality Super League · Aurobindo</footer></main></body></html>
