<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09252e"><title>Lab Process | Aurobindo</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="snake.css?v=9"><script defer src="snake.js?v=29"></script></head>
<body><main class="arena"><canvas id="arena" aria-label="Snake arena. Use arrow keys or WASD to steer, or drag anywhere to steer."></canvas>
<div id="wrong-impact" aria-hidden="true"></div><header class="hud"><a href="index.html#/games" aria-label="Back to games">←</a><div><span>COLLECTED</span><strong id="score" aria-live="polite">0 / 5</strong></div><div class="best">BEST <b id="best">0</b></div><button id="sound" aria-label="Toggle sound and haptics" aria-pressed="true">♪</button><button id="pause" aria-label="Pause game" disabled>Ⅱ</button><ol id="inventory" aria-label="Collected icons this level"></ol></header>
<aside class="leaderboard"><span>LAB LEVELS</span><ol id="leaders"></ol></aside>
<div id="bite-feedback" class="bite-feedback" hidden role="status"><strong id="bite-label"></strong><span id="bite-detail"></span></div><div id="unlock-progress" class="unlock-progress"></div><div id="celebration" class="celebration" hidden role="status"><canvas id="reward-preview" hidden></canvas><strong id="celebration-text"></strong></div><div class="hint" id="hint">Find the correct lab process sequence.</div>
<div class="controls" id="controls"><div id="joystick" role="group" aria-label="Touch steering"><i id="stick"></i><span>STEER</span></div><button id="boost" aria-label="Hold to boost">⚡<small id="boost-label">EMPTY</small></button></div>
<section class="overlay" id="overlay"><div class="panel"><div id="level-reward" hidden><span id="level-status"></span><canvas id="level-reward-canvas" aria-hidden="true"></canvas><strong id="level-reward-name"></strong></div><h1 id="title">Lab<span>Process</span></h1><p id="message">Eat lab icons in order. Complete 3 levels.</p><p class="instructions">Drag / arrows to steer. Veggies refill boost.</p><p id="results" class="results" hidden></p><fieldset id="snake-picker" class="snake-picker"><legend>Snake</legend><div id="snake-types" class="snake-types" role="group" aria-label="Snake body type"></div><div id="snake-options" class="snake-options"></div></fieldset><button class="primary" id="start">Play</button><a href="index.html#/games">Back to games</a></div></section>
<section id="tutorial" hidden role="dialog" aria-modal="true" aria-labelledby="tutorial-title"><div id="tutorial-spotlight"><img id="tutorial-vegetable" src="assets/snake-game-assets/spawnables/veg-1.webp" alt="Vegetable"></div><div class="tutorial-card"><small id="tutorial-step"></small><h2 id="tutorial-title"></h2><p id="tutorial-text"></p><button id="tutorial-next" class="primary">Next</button></div></section><div class="sr-only" id="announcement" aria-live="polite"></div></main></body></html>
